name: Build KiteWare

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı!"
            echo "Dosyalar:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle projesi:"
          echo "$PROJECT_DIR"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Gradle version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      - name: Clean
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew build --no-daemon --stacktrace --info

      - name: Show JAR
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILD/LIBS ==="
          ls -lah build/libs/

          echo
          echo "=== JARLAR ==="
          find build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KiteWare-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
